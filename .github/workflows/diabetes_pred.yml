name: Diabetes Prediction CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  model-metrics:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run model building script
      - name: Run model building
        run: |
          python src/model_building.py > metrics.log

      # Upload results + models as artifacts
      - name: Upload trained models and results
        uses: actions/upload-artifact@v4
        with:
          name: model-building-results
          path: |
            results/*.json
            models/*.pkl

      # Display only metrics summary in logs
      - name: Show model metrics
        run: |
          echo "=== Model Metrics Summary ==="
          grep "Cross val score" metrics.log || true
          grep "Final Model Comparison Summary" -A 10 metrics.log || true
