stages:
  data_ingestion:
    cmd: python .\src\data_ingestion_preprocessing.py
    deps:
    - .\data\diabetes.csv
    - .\src\data_ingestion_preprocessing.py
    params:
    - data_ingestion.n_neighbors
    outs:
    - data\preprocessed
  feature_engineering:
    cmd: python .\src\feature_engineering.py
    deps:
    - .\data\preprocessed\preprocessed_data.csv
    - .\src\feature_engineering.py
    outs:
    - data\feature_engineering
  model_building:
    cmd: python .\src\model_building.py
    deps:
    - .\data\feature_engineering\feature_engineering_data.csv
    - .\src\model_building.py
    params:
    - model_building.lgbm.learning_rate
    - model_building.lgbm.max_depth
    - model_building.lgbm.n_estimators
    - model_building.lgbm.random_state
    - model_building.random_forest.max_depth
    - model_building.random_forest.max_features
    - model_building.random_forest.min_samples_split
    - model_building.random_forest.n_estimators
    - model_building.random_forest.random_state
    - model_building.train_test_split.random_state
    - model_building.train_test_split.test_size
    - model_building.xgb.learning_rate
    - model_building.xgb.max_depth
    - model_building.xgb.min_samples_split
    - model_building.xgb.n_estimators
    - model_building.xgb.random_state
    outs:
    - models
  model_evaluation:
    cmd: python .\src\model_evaluation.py
    deps:
    - .\data\testing_data\X_test.csv
    - .\data\testing_data\X_train.csv
    - .\data\testing_data\y_test.csv
    - .\data\testing_data\y_train.csv
    - .\src\model_evaluation.py
    outs:
    - results\
